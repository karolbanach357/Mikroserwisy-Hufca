server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy do Drużyn
    location /api/druzyny {
        proxy_pass http://druzyna-service:8081;
        proxy_set_header Host $host;
    }

    # Proxy do Harcerzy
    location /api/harcerze {
        proxy_pass http://harcerz-service:8080;
        proxy_set_header Host $host;
    }
}
