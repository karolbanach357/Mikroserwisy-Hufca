<div class="container" style="max-width: 500px; margin-top: 20px;">
  <h2>{{ isEditMode ? 'Edytuj Drużynę' : 'Dodaj Nową Drużynę' }}</h2>

  <form (ngSubmit)="onSubmit()" #form="ngForm">

    <div class="form-group">
      <label for="nazwa">Nazwa Drużyny</label>
      <input
        type="text"
        id="nazwa"
        required
        [(ngModel)]="druzyna.nazwa"
        name="nazwa"
        class="form-control">
    </div>

    <div class="form-group" style="margin-top: 10px;">
      <label for="numer">Numer Drużyny</label>
      <input
        type="number"
        id="numer"
        required
        [(ngModel)]="druzyna.numer"
        name="numer"
        class="form-control">
    </div>

    <div style="margin-top: 20px;">
      <button type="submit" class="btn btn-success" [disabled]="!form.valid">
        Zapisz
      </button>
      <a routerLink="/druzyny" class="btn btn-secondary" style="margin-left: 10px;">
        Anuluj
      </a>
    </div>

  </form>
</div>
